<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Your Tour | Kanonya Shoebill Tours</title><meta name="description" content="Book your Mabamba shoebill canoe tour. Choose a date and group size and see your price instantly."><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div id="hdr"></div><header class="ph" style="background-image:url(images/canoe-photographer.jpg)"><div class="wrap"><h1>Book your tour</h1><p>Choose your date and group size. We will confirm your canoe on WhatsApp.</p></div></header><section class="sec"><div class="wrap" style="max-width:680px"><form id="bk"><div class="row"><label>Full name<input name="fullname" required minlength="2" autocomplete="name"></label><label>Phone / WhatsApp<input name="phone" type="tel" required minlength="7" autocomplete="tel" placeholder="+256…"></label></div><div class="row"><label>Preferred date<input name="date" type="date" required></label><label>Travellers<input name="travellers" type="number" min="1" max="20" value="1" required></label></div><label>Message (optional)<textarea name="message" rows="3" maxlength="500"></textarea></label><div class="quote"><div id="q"></div><small>per-person price × travellers</small></div><button class="btn" type="submit">Send booking on WhatsApp</button></form>
<div class="ok" id="ok"><svg class="tick" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"/><path d="M30 52l14 14 27-30"/></svg><h2>Booking ready!</h2><p class="lead" style="margin:10px auto">Opening WhatsApp with your details. Just press send. If nothing opens, use the buttons below.</p><p style="margin-top:20px"><a class="btn" id="wal" href="#">Open WhatsApp</a> <a class="btn" style="background:var(--sand)" id="mal" href="#">Send by email</a></p></div></div></section><div id="ftr"></div><script src="script.js"></script></body></html>
